[alembic]
# Migration script directory (relative to backend/)
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os

# NOTE: sqlalchemy.url is intentionally NOT set here.
# migrations/env.py reads the connection string from app.core.config.Settings,
# so dev / CI / demo share exactly one source of truth.
# This file is kept ASCII-only on purpose: Alembic reads it with the OS default
# encoding (cp936 on Chinese Windows), so non-ASCII characters break
# `alembic upgrade head` on Windows with a UnicodeDecodeError.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
