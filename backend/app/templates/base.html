<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %} · SmartTrip</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  {# 前端依赖一律本地文件，不引 CDN：答辩现场断网也要能跑（Issue #1） #}
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='vendor/alpine.min.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">SmartTrip<span class="dot">·</span>智能旅游规划</a>
      <nav class="nav">
        <a href="/docs">接口文档</a>
        <a href="/api/health">健康检查</a>
        <span class="badge badge-{{ app_env }}">{{ app_env }}</span>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>《软件工程与项目管理》第 1 组 · v{{ app_version }}</span>
      <span>FastAPI + Jinja2 单体 · 服务端渲染</span>
    </div>
  </footer>
</body>
</html>
