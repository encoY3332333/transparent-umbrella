[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-trip"
version = "0.1.0"
description = "智能旅游规划系统（SmartTrip）——FastAPI + Jinja2 单体应用"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "《软件工程与项目管理》第 1 组" }]
keywords = ["travel", "itinerary", "fastapi", "jinja2"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0.36,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "pyjwt>=2.9,<3.0",
  "cachetools>=5.5,<6.0",
]

[project.optional-dependencies]
# 只有演示/生产切 MySQL 时才需要（开发与 CI 用 SQLite，不装这个也能跑）
mysql = ["pymysql>=1.1,<2.0"]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "types-cachetools",
]

# ---------------------------------------------------------------
# Ruff：同时承担 lint 与格式化，全组统一 line-length=100
# 不额外建 setup.cfg / .flake8 / tox.ini，避免四个人四种读法
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：FastAPI 的 Depends()/Query() 写在默认值里是官方写法，不是可变默认值错误
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------
# Mypy：strict 从宽起步——先卡住函数签名与未注解定义，不启用 disallow_any
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cachetools.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: 耗时较长的测试（默认仍会执行，仅用于本地筛选用）",
]

# ---------------------------------------------------------------
# Coverage：CI 的 --cov-fail-under=40 会卡这条线
# ---------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/templates/*",
  "app/static/*",
  "app/seed/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------
# 打包：模板、静态资源、种子数据随包分发，否则 pip install 后 404
# ---------------------------------------------------------------
[tool.setuptools]
packages = [
  "app",
  "app.core",
  "app.api",
  "app.models",
  "app.schemas",
  "app.services",
  "app.engine",
  "app.adapters",
  "app.seed",
]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*", "seed/*.json"]
