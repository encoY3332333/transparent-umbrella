name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================
  # 应用：安装依赖 → Ruff 静态检查 → Ruff 格式 → Mypy 类型 → Pytest 含覆盖率
  # ===========================================================
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if backend exists
        id: guard
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/pyproject.toml 尚未创建（Issue #1 脚手架任务），跳过后端检查"
          fi

      - name: Setup Python
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff check)
        if: steps.guard.outputs.exists == 'true'
        run: ruff check app tests

      - name: Format check (Ruff format)
        if: steps.guard.outputs.exists == 'true'
        run: ruff format --check app tests

      - name: Type check (Mypy)
        if: steps.guard.outputs.exists == 'true'
        run: mypy app
        continue-on-error: true

      - name: Test with coverage
        if: steps.guard.outputs.exists == 'true'
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: ci
        run: |
          pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=40

      - name: Upload coverage report
        if: steps.guard.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14

  # ===========================================================
  # 模板：Jinja2 语法编译 + 静态资源引用检查
  # 前端由服务端渲染，没有 Node 构建步骤，但模板写错同样要拦在合并前
  # ===========================================================
  templates:
    name: Templates (Jinja2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if templates exist
        id: guard
        run: |
          if [ -d backend/app/templates ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/app/templates 尚未创建（Issue #1 脚手架任务），跳过模板检查"
          fi

      - name: Setup Python
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Jinja2
        if: steps.guard.outputs.exists == 'true'
        run: pip install "jinja2>=3.1"

      - name: Compile all templates
        if: steps.guard.outputs.exists == 'true'
        run: python scripts/check-templates.py

  # ===========================================================
  # 仓库规范检查：Commit 信息、分支命名、密钥泄露
  # ===========================================================
  lint-repo:
    name: Repo Conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "分支名：$BRANCH"
          if [[ ! "$BRANCH" =~ ^(feature|bugfix|hotfix)/[0-9]+-[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^chore/[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^(dependabot|renovate)/ ]]; then
            echo "::error::分支名 '$BRANCH' 不符合规范。正确格式：feature/12-short-desc | bugfix/21-short-desc | hotfix/30-short-desc | chore/short-desc"
            exit 1
          fi

      - name: Check commit messages
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          COMMITS=$(git log --no-merges --format=%s "$BASE..HEAD" 2>/dev/null || git log --no-merges --format=%s -20)
          echo "本 PR 的提交信息："
          echo "$COMMITS"
          FAIL=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if [[ ! "$msg" =~ ^(feat|fix|docs|test|refactor|style|chore|perf)(\([a-z0-9-]+\))?:\ .{3,} ]]; then
              echo "::error::提交信息不符合 Conventional Commits：'$msg'"
              FAIL=1
            fi
          done <<< "$COMMITS"
          exit $FAIL

      - name: Scan for hardcoded secrets
        run: |
          echo "扫描疑似密钥..."
          PATTERNS='(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}'
          if git grep -nEI "$PATTERNS" -- ':!*.md' ':!.env.example' ':!docs/' ':!*.yml' ':!*.yaml' ':!*.lock' ':!*.puml'; then
            echo "::error::检测到疑似硬编码密钥，请改用 .env + 环境变量（禁止入库）"
            exit 1
          fi
          echo "未发现硬编码密钥"

  # ===========================================================
  # 汇总门禁：以上全部通过才算 CI 通过（建议设为必需状态检查）
  # ===========================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, templates]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "templates: ${{ needs.templates.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.templates.result }}" = "failure" ]; then
            echo "::error::CI 未通过"
            exit 1
          fi
          echo "CI 全部通过"
