name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================
  # 应用：安装依赖 → Ruff 静态检查 → Ruff 格式 → Mypy 类型 → Pytest 含覆盖率
  # ===========================================================
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if backend exists
        id: guard
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/pyproject.toml 尚未创建（Issue #1 脚手架任务），跳过后端检查"
          fi

      - name: Setup Python
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff check)
        if: steps.guard.outputs.exists == 'true'
        run: ruff check app tests

      - name: Format check (Ruff format)
        if: steps.guard.outputs.exists == 'true'
        run: ruff format --check app tests

      - name: Type check (Mypy)
        if: steps.guard.outputs.exists == 'true'
        run: mypy app
        continue-on-error: true

      - name: Test with coverage
        if: steps.guard.outputs.exists == 'true'
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: ci
        run: |
          # -m "not perf"：性能基线在独立 perf job 里跑（仅 main/workflow_dispatch），PR 上跳过
          pytest -q -m "not perf" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=40

      - name: Coverage floor (engine/services >= 60%)
        if: steps.guard.outputs.exists == 'true' && always()
        run: python ../scripts/check-coverage-floor.py coverage.xml

      - name: Upload coverage report
        if: steps.guard.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14

  # ===========================================================
  # 模板：Jinja2 语法编译 + 静态资源引用检查
  # 前端由服务端渲染，没有 Node 构建步骤，但模板写错同样要拦在合并前
  # ===========================================================
  templates:
    name: Templates (Jinja2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if templates exist
        id: guard
        run: |
          if [ -d backend/app/templates ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/app/templates 尚未创建（Issue #1 脚手架任务），跳过模板检查"
          fi

      - name: Setup Python
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Jinja2
        if: steps.guard.outputs.exists == 'true'
        run: pip install "jinja2>=3.1"

      - name: Compile all templates
        if: steps.guard.outputs.exists == 'true'
        run: python scripts/check-templates.py

  # ===========================================================
  # 仓库规范检查：Commit 信息、分支命名、密钥泄露
  # ===========================================================
  lint-repo:
    name: Repo Conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "分支名：$BRANCH"
          if [[ ! "$BRANCH" =~ ^(feature|bugfix|hotfix)/[0-9]+-[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^chore/[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^(dependabot|renovate)/ ]]; then
            echo "::error::分支名 '$BRANCH' 不符合规范。正确格式：feature/12-short-desc | bugfix/21-short-desc | hotfix/30-short-desc | chore/short-desc"
            exit 1
          fi

      - name: Check commit messages
        run: |
          BASE="origin/${{ github.base_ref }}"
          # 必须取完整历史：用 --depth=1 会把 origin/main 变成没有父提交的浅提交，
          # 于是 main..HEAD 会把整部历史都算成「本 PR 的提交」（连 Initial commit 一起）。
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          if ! git rev-parse --verify --quiet "$BASE" > /dev/null; then
            echo "::error::取不到基线分支 $BASE，无法校验提交信息"
            exit 1
          fi
          # 只校验本 PR 新增的提交；范围为空说明没有新提交，直接通过。
          # 不要回退到「最近 20 条」——那会把历史提交拉进来，让所有人卡在一个改不掉的失败上。
          COMMITS=$(git log --no-merges --format=%s "$BASE..HEAD")
          if [ -z "$COMMITS" ]; then
            echo "本 PR 没有新增提交，跳过提交信息校验"
            exit 0
          fi
          echo "本 PR 的提交信息："
          echo "$COMMITS"
          ALLOWED="feat|fix|docs|test|refactor|perf|style|chore|build|ci|revert"
          FAIL=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if [[ ! "$msg" =~ ^($ALLOWED)(\([a-z0-9-]+\))?:\ .{3,} ]]; then
              echo "::error::提交信息不符合 Conventional Commits：'$msg'（允许的 type：$ALLOWED）"
              FAIL=1
            fi
          done <<< "$COMMITS"
          exit $FAIL

      - name: Scan for hardcoded secrets
        run: |
          echo "扫描疑似密钥..."
          PATTERNS='(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}'
          # 排除清单：
          #   *.md / docs/     —— 文档要举例，写的是占位符
          #   *.yml / *.yaml   —— CI 与 compose 里的演示口令
          #   .env.example     —— 配置样例本身就该长得像密钥
          #   backend/tests/   —— 测试固件用的是固定假值，必须可复现，不能换成环境变量
          if git grep -nEI "$PATTERNS" -- \
              ':!*.md' ':!.env.example' ':!docs/' ':!*.yml' ':!*.yaml' ':!*.lock' ':!*.puml' \
              ':!backend/tests/'; then
            echo "::error::检测到疑似硬编码密钥，请改用 .env + 环境变量（禁止入库）"
            exit 1
          fi
          echo "未发现硬编码密钥"

      - name: Check doc links
        run: python3 scripts/check-doc-links.py

  # ===========================================================
  # 性能基线：200 POI × 7 天 P95 ≤ 10s（NFR-P1）。
  # 仅 main 与 workflow_dispatch 运行——PR 上跑太慢，且性能受 runner 波动影响大
  # ===========================================================
  perf:
    name: Perf Baseline
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if backend exists
        id: guard
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/pyproject.toml 尚未创建，跳过性能基线"
          fi

      - name: Setup Python
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run performance baseline
        if: steps.guard.outputs.exists == 'true'
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: ci
        run: pytest -q -m perf -s

  # ===========================================================
  # 汇总门禁：以上全部通过才算 CI 通过（建议设为必需状态检查）
  # ===========================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, templates]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "templates: ${{ needs.templates.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.templates.result }}" = "failure" ]; then
            echo "::error::CI 未通过"
            exit 1
          fi
          echo "CI 全部通过"
