name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # 后端：Maven 安装依赖 → Checkstyle → 单元测试含覆盖率 → 打包
  # ===========================================================
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if backend exists
        id: guard
        run: |
          if [ -f backend/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/pom.xml 尚未创建（Issue #1 脚手架任务），跳过后端构建"
          fi

      - name: Setup JDK 17
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B -q dependency:go-offline

      - name: Lint (Checkstyle)
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B checkstyle:check
        continue-on-error: true

      - name: Test with coverage
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B test

      - name: Build
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload coverage report
        if: steps.guard.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

  # ===========================================================
  # 前端：npm 安装依赖 → Lint → 单元测试含覆盖率 → 构建
  # ===========================================================
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: guard
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json 尚未创建（Issue #1 脚手架任务），跳过前端构建"
          fi

      - name: Setup Node 22
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.guard.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Test with coverage
        if: steps.guard.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present -- --run --coverage

      - name: Build
        if: steps.guard.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        if: steps.guard.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ===========================================================
  # 仓库规范检查：Commit 信息、分支命名、密钥泄露
  # ===========================================================
  lint-repo:
    name: Repo Conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "分支名：$BRANCH"
          if [[ ! "$BRANCH" =~ ^(feature|bugfix|hotfix)/[0-9]+-[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^chore/[a-z0-9-]+$ ]] && \
             [[ ! "$BRANCH" =~ ^(dependabot|renovate)/ ]]; then
            echo "::error::分支名 '$BRANCH' 不符合规范。正确格式：feature/12-short-desc | bugfix/21-short-desc | hotfix/30-short-desc | chore/short-desc"
            exit 1
          fi

      - name: Check commit messages
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          COMMITS=$(git log --no-merges --format=%s "$BASE..HEAD" 2>/dev/null || git log --no-merges --format=%s -20)
          echo "本 PR 的提交信息："
          echo "$COMMITS"
          FAIL=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if [[ ! "$msg" =~ ^(feat|fix|docs|test|refactor|style|chore|perf)(\([a-z0-9-]+\))?:\ .{3,} ]]; then
              echo "::error::提交信息不符合 Conventional Commits：'$msg'"
              FAIL=1
            fi
          done <<< "$COMMITS"
          exit $FAIL

      - name: Scan for hardcoded secrets
        run: |
          echo "扫描疑似密钥..."
          PATTERNS='(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}'
          if git grep -nEI "$PATTERNS" -- ':!*.md' ':!.env.example' ':!docs/' ':!*.yml' ':!*.yaml' ':!package-lock.json'; then
            echo "::error::检测到疑似硬编码密钥，请改用 .env + 环境变量（禁止入库）"
            exit 1
          fi
          echo "未发现硬编码密钥"

  # ===========================================================
  # 汇总门禁：以上全部通过才算 CI 通过（建议设为必需状态检查）
  # ===========================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "backend: ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ]; then
            echo "::error::CI 未通过"
            exit 1
          fi
          echo "CI 全部通过"
